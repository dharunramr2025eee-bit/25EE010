<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hostel Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div>
      <h1>Hostel Management System</h1>
      <p>Student • Room • Complaint Management</p>
    </div>
    <span id="apiStatus" class="status">Checking backend...</span>
  </header>

  <main>
    <section class="dashboard">
      <div class="card"><h3>Students</h3><strong id="studentCount">0</strong></div>
      <div class="card"><h3>Rooms</h3><strong id="roomCount">0</strong></div>
      <div class="card"><h3>Available Beds</h3><strong id="availableCount">0</strong></div>
      <div class="card"><h3>Complaints</h3><strong id="complaintCount">0</strong></div>
    </section>

    <section class="panel">
      <h2>Add Student</h2>
      <form id="studentForm">
        <input id="studentName" placeholder="Student name" required>
        <input id="studentEmail" type="email" placeholder="Email" required>
        <input id="studentPhone" placeholder="Phone" required>
        <input id="studentDept" placeholder="Department" required>
        <input id="studentYear" type="number" min="1" max="5" placeholder="Year" required>
        <input id="studentRoom" type="number" placeholder="Room ID (optional)">
        <button type="submit">Add Student</button>
      </form>
    </section>

    <section class="panel">
      <h2>Add Room</h2>
      <form id="roomForm">
        <input id="roomNumber" placeholder="Room number" required>
        <select id="roomType">
          <option value="SINGLE">Single</option>
          <option value="DOUBLE">Double</option>
          <option value="TRIPLE">Triple</option>
          <option value="FOUR_SHARING">Four Sharing</option>
        </select>
        <input id="roomCapacity" type="number" min="1" max="10" placeholder="Capacity" required>
        <button type="submit">Add Room</button>
      </form>
    </section>

    <section class="grid">
      <div class="panel">
        <h2>Students</h2>
        <div class="table-wrap">
          <table>
            <thead><tr><th>ID</th><th>Name</th><th>Dept</th><th>Year</th><th>Room</th><th>Action</th></tr></thead>
            <tbody id="studentTable"></tbody>
          </table>
        </div>
      </div>
      <div class="panel">
        <h2>Rooms</h2>
        <div class="table-wrap">
          <table>
            <thead><tr><th>ID</th><th>Room</th><th>Type</th><th>Capacity</th><th>Occupied</th><th>Available</th></tr></thead>
            <tbody id="roomTable"></tbody>
          </table>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2>Register Complaint</h2>
      <form id="complaintForm">
        <input id="complaintStudentId" type="number" placeholder="Student ID" required>
        <input id="complaintTitle" placeholder="Complaint title" required>
        <textarea id="complaintDescription" placeholder="Description" required></textarea>
        <button type="submit">Submit Complaint</button>
      </form>
      <div class="table-wrap">
        <table>
          <thead><tr><th>ID</th><th>Student</th><th>Title</th><th>Status</th><th>Action</th></tr></thead>
          <tbody id="complaintTable"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
